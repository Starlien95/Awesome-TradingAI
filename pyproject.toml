[build-system]
requires = ["setuptools>=84.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-bench"
version = "0.1.0"
description = "The reproducible cryptocurrency AI trading benchmark engine for Awesome TradingAI."
readme = "README.md"
requires-python = ">=3.10,<3.13"
authors = [{name = "Awesome TradingAI contributors"}]
license = "MIT"
license-files = [
  "LICENSE",
  "LICENSES/*.txt",
  "THIRD_PARTY_NOTICES.md",
  "src/quant_bench/methods/finmem/investorbench/LICENSE",
]
keywords = ["cryptocurrency", "benchmark", "trading-ai", "quantitative-finance", "qlib"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
  "numpy>=1.24,<3",
  "pandas>=2.0,<3",
  "platformdirs>=4,<5",
  "pydantic>=2.8,<3",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
qlib = ["pyqlib==0.9.7"]
lgbm = ["lightgbm>=4.7.0,<5"]
xgboost = ["xgboost>=3.2.0,<4"]
catboost = ["catboost>=1.2.10,<2"]
torch = ["torch>=2.14.0,<3"]
tuning = ["optuna>=5.0.0,<6"]
tracking = ["mlflow>=3.16.1,<4"]
data-ccxt = ["ccxt>=4.5.84,<5"]
data-qlib = [
  "ccxt>=4.5.84,<5",
  "loguru>=0.7.3,<1",
  "pyqlib==0.9.7",
  "tqdm>=4.70.1,<5",
]
dashboard = ["plotly>=7.1.0,<8", "streamlit>=1.64.0,<2"]
visualization = ["matplotlib>=3.10.9,<4", "seaborn>=0.13.2,<1"]
fingpt-live = [
  "feedparser>=6.0.14,<7",
  "python-dateutil>=2.9.0.post0,<3",
  "python-okx>=0.4.4,<1",
  "requests>=2.34.2,<3",
]
finmem = [
  "cvxpy>=1.7.5,<2",
  "httpx>=0.28.1,<1",
  "json-repair>=0.63.5,<1",
  "loguru>=0.7.3,<1",
  "orjson>=3.12.0,<4",
  "python-dotenv>=1.2.3,<2",
  "qdrant-client>=1.19.1,<2",
  "rich>=15.0.0,<16",
  "typer>=0.27.2,<1",
]
finmem-live = [
  "beautifulsoup4>=4.15.0,<5",
  "feedparser>=6.0.14,<7",
  "python-dateutil>=2.9.0.post0,<3",
  "python-okx>=0.4.4,<1",
  "textblob>=0.20.1,<1",
]
finmem-guardrails = ["guardrails-ai>=0.11.0,<0.12"]
docs = ["mkdocs-material>=9.7.7,<10"]
release = [
  "cyclonedx-bom>=7.4.0,<8",
  "pip-licenses>=5.5.5,<6",
  "tomli>=2,<3; python_version < '3.11'",
]
runtime = [
  "beautifulsoup4>=4.15.0,<5",
  "joblib>=1.6.0,<2",
  "requests>=2.34.2,<3",
  "scipy>=1.15.3,<2",
]
runtime-okx = ["python-okx>=0.4.4,<1"]
news = [
  "accelerate>=1.15.0",
  "peft>=0.21.0",
  "safetensors>=0.8.0",
  "sentencepiece>=0.2.2",
  "torch>=2.14.0,<3",
  "transformers>=5.17.0",
]
dev = [
  "build>=1.6.1,<2",
  "mypy>=2.3.1,<3",
  "numpy>=1.24,<2.3",
  "pandas-stubs>=2.3.3.260113",
  "pytest>=9.1.1,<10",
  "pytest-cov>=7.1.0,<8",
  "ruff>=0.16.9,<1",
  "tomli>=2,<3; python_version < '3.11'",
  "types-PyYAML>=6.0.12.20260906,<7",
]
all = [
  "accelerate>=1.15.0",
  "catboost>=1.2.10,<2",
  "ccxt>=4.5.84,<5",
  "lightgbm>=4.7.0,<5",
  "loguru>=0.7.3,<1",
  "cvxpy>=1.7.5,<2",
  "feedparser>=6.0.14,<7",
  "guardrails-ai>=0.11.0,<0.12",
  "httpx>=0.28.1,<1",
  "json-repair>=0.63.5,<1",
  "mlflow>=3.16.1,<4",
  "mkdocs-material>=9.7.7,<10",
  "matplotlib>=3.10.9,<4",
  "optuna>=5.0.0,<6",
  "orjson>=3.12.0,<4",
  "peft>=0.21.0",
  "plotly>=7.1.0,<8",
  "pyqlib==0.9.7",
  "python-okx>=0.4.4,<1",
  "python-dateutil>=2.9.0.post0,<3",
  "python-dotenv>=1.2.3,<2",
  "qdrant-client>=1.19.1,<2",
  "rich>=15.0.0,<16",
  "safetensors>=0.8.0",
  "seaborn>=0.13.2,<1",
  "sentencepiece>=0.2.2",
  "streamlit>=1.64.0,<2",
  "textblob>=0.20.1,<1",
  "beautifulsoup4>=4.15.0,<5",
  "joblib>=1.6.0,<2",
  "requests>=2.34.2,<3",
  "scipy>=1.15.3,<2",
  "torch>=2.14.0,<3",
  "tqdm>=4.70.1,<5",
  "transformers>=5.17.0",
  "typer>=0.27.2,<1",
  "xgboost>=3.2.0,<4",
]

[project.urls]
Repository = "https://github.com/Starlien95/Awesome-TradingAI"
Documentation = "https://github.com/Starlien95/Awesome-TradingAI/tree/main/docs"
Issues = "https://github.com/Starlien95/Awesome-TradingAI/issues"

[project.scripts]
quant-bench = "quant_bench.cli.app:main"

[project.entry-points."quant_bench.models"]
numpy_linear_v1 = "quant_bench.models.numpy_linear:NumpyLinearPlugin"
qlib_model_v1 = "quant_bench.integrations.qlib.model:QlibModelPlugin"

[project.entry-points."quant_bench.features"]
crypto_ohlcv6_v1 = "quant_bench.features.crypto_ohlcv6:CryptoOHLCV6V1"
crypto_alpha52_v1 = "quant_bench.features.crypto_alpha52:CryptoAlpha52V1"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
quant_bench = [
  "methods/finmem/**/LICENSE",
  "methods/finmem/**/*.json",
  "methods/finmem/**/*.pkl",
  "methods/finmem/**/*.txt",
  "methods/finmem/**/env.example",
  "methods/**/*.csv",
  "methods/**/*.md",
  "methods/**/*.sh",
  "methods/**/*.yaml",
  "resources/**/*.csv",
  "resources/**/*.yaml",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "qlib: requires the optional pyqlib dependency",
  "network: performs an explicit public network check",
  "packaging: builds or installs a distribution artifact",
]

[tool.ruff]
line-length = 110
target-version = "py310"
exclude = [
  "src/quant_bench/methods/finmem/investorbench",
  "src/quant_bench/methods/finmem/live",
  "src/quant_bench/data/qlib_pipeline.py",
  "src/quant_bench/integrations/qlib/legacy",
  "tools/legacy_qlib",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.10"
packages = ["quant_bench"]
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
  "qlib.*",
  "streamlit.*",
  "torch.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
  "quant_bench.dashboard.*",
  "quant_bench.methods.*",
  "quant_bench.runtime.*",
  "quant_bench.data.qlib_pipeline",
  "quant_bench.integrations.qlib.legacy.*",
  "quant_bench.integrations.qlib.handlers",
  "quant_bench.integrations.qlib.models.tft",
  "quant_bench.integrations.qlib.strategy",
]
ignore_errors = true
