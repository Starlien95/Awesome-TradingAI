name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  core-tests:
    name: Core tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install core development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run dependency-light tests
        run: pytest -q

  quality:
    name: Static, documentation, and release policy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install quality and documentation dependencies
        run: python -m pip install -e ".[dev,docs]"
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy --strict src/quant_bench
      - name: Build documentation
        run: mkdocs build --strict --site-dir "$RUNNER_TEMP/quant-bench-site"
      - name: Audit normalized Qlib workflows
        run: quant-bench workflows audit src/quant_bench/resources/qlib_workflows --require-normalized
      - name: Audit release and FinMem boundaries
        run: |
          python tools/check_release.py
          python tools/check_finmem_public.py
      - name: Run offline runtime smoke
        run: python tools/smoke_runtime.py --workspace "$RUNNER_TEMP/empty-workspace"

  wheel:
    name: Wheel boundary and clean-install smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build frontend
        run: python -m pip install "build>=1.2,<2"
      - name: Build wheel and source distribution
        run: python -m build
      - name: Audit wheel contents
        run: |
          python tools/check_wheel.py dist/quant_bench-*.whl
          python tools/check_sdist.py dist/quant_bench-*.tar.gz
      - name: Install wheel in a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/wheel-venv"
          "$RUNNER_TEMP/wheel-venv/bin/python" -m pip install dist/quant_bench-*.whl
          "$RUNNER_TEMP/wheel-venv/bin/python" -m pip check
      - name: Run installed-wheel offline workflows
        run: |
          QB="$RUNNER_TEMP/wheel-venv/bin/quant-bench"
          WORKSPACE="$RUNNER_TEMP/wheel-workspace"
          "$QB" quickstart --offline --workspace "$WORKSPACE"
          "$QB" fingpt init --workspace "$WORKSPACE"
          "$QB" fingpt validate --config "$WORKSPACE/methods/fingpt_news/research/config.yaml"
          "$QB" fingpt backtest \
            --config "$WORKSPACE/methods/fingpt_news/research/config.yaml" \
            --output "$WORKSPACE/runs/fingpt-ci"
          "$QB" fingpt paper-dry-run --workspace "$WORKSPACE"
      - name: Confirm optional network clients are absent
        run: |
          "$RUNNER_TEMP/wheel-venv/bin/python" - <<'PY'
          import importlib.util
          for name in ("bs4", "feedparser", "okx", "requests", "transformers"):
              assert importlib.util.find_spec(name) is None, name
          PY

  qlib-contract:
    name: Qlib 0.9.7 contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Qlib integration dependencies
        run: python -m pip install -e ".[dev,data-qlib,lgbm]"
      - name: Run Qlib data, record, workflow, and normalization tests
        run: |
          pytest -q \
            tests/unit/test_qlib_data_pipeline.py \
            tests/unit/test_qlib_records.py \
            tests/unit/test_qlib_workflow_catalog.py \
            tests/integration/test_qlib_workflow_run.py \
            tests/integration/test_workflow_normalization.py
      - name: Audit all packaged workflows
        run: quant-bench workflows audit src/quant_bench/resources/qlib_workflows --require-normalized

  dashboard:
    name: Dashboard contract and AppTest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dashboard test dependencies
        run: python -m pip install -e ".[dev,dashboard]"
      - name: Run dashboard tests
        run: |
          pytest -q \
            tests/unit/test_dashboard_analytics.py \
            tests/unit/test_dashboard_data.py \
            tests/integration/test_dashboard_app.py
