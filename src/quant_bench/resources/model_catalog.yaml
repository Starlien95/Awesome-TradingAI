schema_version: "1"

models:
  - model_id: numpy_linear_v1
    display_name: NumPy ridge linear baseline
    aliases: [linear_baseline, baseline]
    backend: builtin
    module_path: quant_bench.models.numpy_linear
    class_name: NumpyLinearPlugin
    family: baseline
    verified_against: quant-bench-0.1
    default_kwargs: {ridge: 1.0e-6}
    supported_feature_sets: [crypto_ohlcv6_v1, crypto_alpha52_v1]
    capabilities:
      task_types: [regression]
      feature_shapes: [tabular]
      dataset_kinds: [canonical]
      deterministic: true
      native_artifact_formats: [npz]
    status: stable

  - model_id: qlib_lightgbm
    display_name: Qlib LightGBM
    aliases: [lgb, lightgbm, LGBModel]
    backend: qlib
    module_path: qlib.contrib.model.gbdt
    class_name: LGBModel
    family: tree
    verified_against: pyqlib-0.9.7
    default_kwargs: {}
    capabilities: &tree_capabilities
      task_types: [regression, ranking]
      feature_shapes: [tabular]
      dataset_kinds: [DatasetH]
      deterministic: true
      native_artifact_formats: [lightgbm_text]
      optional_extra: qlib,lgbm
    status: stable

  - model_id: qlib_highfreq_lightgbm
    display_name: Qlib high-frequency LightGBM
    aliases: [hflgb, HFLGBModel]
    backend: qlib
    module_path: qlib.contrib.model.highfreq_gdbt_model
    class_name: HFLGBModel
    family: tree
    verified_against: pyqlib-0.9.7
    default_kwargs: {}
    capabilities:
      <<: *tree_capabilities
      required_metadata: [high_frequency_targets]
    status: requires_metadata
    notes: Requires a high-frequency target layout compatible with HFLGBModel.

  - model_id: qlib_xgboost
    display_name: Qlib XGBoost
    aliases: [xgb, xgboost, xgboost_btc, XGBModel]
    backend: qlib
    module_path: qlib.contrib.model.xgboost
    class_name: XGBModel
    family: tree
    verified_against: pyqlib-0.9.7
    default_kwargs: {}
    capabilities:
      <<: *tree_capabilities
      native_artifact_formats: [xgboost_ubjson]
      optional_extra: qlib,xgboost
    status: stable

  - model_id: qlib_catboost
    display_name: Qlib CatBoost
    aliases: [catboost, CatBoostModel]
    backend: qlib
    module_path: qlib.contrib.model.catboost_model
    class_name: CatBoostModel
    family: tree
    verified_against: pyqlib-0.9.7
    default_kwargs: {}
    capabilities:
      <<: *tree_capabilities
      native_artifact_formats: [catboost_binary]
      optional_extra: qlib,catboost
    status: stable

  - model_id: qlib_double_ensemble
    display_name: Qlib DoubleEnsemble
    aliases: [doubleensemble, DEnsembleModel]
    backend: qlib
    module_path: qlib.contrib.model.double_ensemble
    class_name: DEnsembleModel
    family: ensemble
    verified_against: pyqlib-0.9.7
    default_kwargs: {}
    capabilities:
      <<: *tree_capabilities
      optional_extra: qlib,lgbm
    status: stable

  - model_id: qlib_linear
    display_name: Qlib linear model
    aliases: [linear, LinearModel]
    backend: qlib
    module_path: qlib.contrib.model.linear
    class_name: LinearModel
    family: linear
    verified_against: pyqlib-0.9.7
    default_kwargs: {}
    capabilities:
      task_types: [regression]
      feature_shapes: [tabular]
      dataset_kinds: [DatasetH]
      deterministic: true
      native_artifact_formats: [trusted_local_checkpoint]
      optional_extra: qlib
    status: stable

  - model_id: qlib_mlp
    display_name: Qlib PyTorch MLP
    aliases: [mlp, DNNModelPytorch]
    backend: qlib
    module_path: qlib.contrib.model.pytorch_nn
    class_name: DNNModelPytorch
