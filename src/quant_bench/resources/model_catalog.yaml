    backend: qlib
    module_path: qlib.contrib.model.pytorch_tra
    class_name: TRAModel
    family: routing
    verified_against: pyqlib-0.9.7
    default_kwargs:
      model_config:
        input_size: 6
        hidden_size: 64
        num_layers: 2
        rnn_arch: GRU
        use_attn: true
        dropout: 0.0
      tra_config:
        num_states: 1
        hidden_size: 8
        rnn_arch: GRU
        num_layers: 1
        dropout: 0.0
        tau: 1.0
        src_info: LR_TPE
    capabilities:
      task_types: [regression, routing]
      feature_shapes: [multi_task_sequence]
      dataset_kinds: [MTSDatasetH]
      deterministic: false
      native_artifact_formats: [state_dict]
      optional_extra: qlib,torch
