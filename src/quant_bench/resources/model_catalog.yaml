    module_path: qlib.contrib.model.pytorch_adarnn
    class_name: ADARNN
    family: neural
    verified_against: pyqlib-0.9.7
    default_kwargs: {}
    capabilities: &torch_sequence_capabilities
      task_types: [regression]
      feature_shapes: [sequence, sequence_flat]
      dataset_kinds: [DatasetH, TSDatasetH]
      deterministic: false
      native_artifact_formats: [state_dict]
      optional_extra: qlib,torch
    status: experimental

  - model_id: qlib_add
    display_name: Qlib ADD
    aliases: [add, ADD]
