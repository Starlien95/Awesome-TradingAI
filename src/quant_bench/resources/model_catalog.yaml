    verified_against: pyqlib-0.9.7
    default_kwargs: {}
    capabilities: &torch_tabular_capabilities
      task_types: [regression]
      feature_shapes: [tabular]
      dataset_kinds: [DatasetH]
      deterministic: false
      native_artifact_formats: [state_dict]
      optional_extra: qlib,torch
    status: stable

  - model_id: qlib_adarnn
    display_name: Qlib AdaRNN
