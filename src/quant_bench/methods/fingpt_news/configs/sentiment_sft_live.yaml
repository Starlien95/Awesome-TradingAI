runtime:
  run_dir: runs/fingpt_news/FinGPTSentimentSFT_1d
  dry_run: true
  dry_run_prices:
    ADA-USDT: 0.75
    BTC-USDT: 68000.0
    DOGE-USDT: 0.16
    ETH-USDT: 3600.0
    HBAR-USDT: 0.09
    LINK-USDT: 18.0
    LTC-USDT: 85.0
    OKB-USDT: 58.0
    TRX-USDT: 0.12
    XRP-USDT: 0.62
  sample_news:
  - date: '2026-05-28 12:00:00'
    source: DryRun
    subject: bitcoin
    title: Bitcoin and Ethereum rise as crypto market sentiment improves
    text: Bitcoin and Ethereum gained as traders reacted to stronger institutional
